[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmcli"
dynamic = ["version"]
description = "Manage Gmail from the terminal: read, search, send, and organize mail over the Gmail API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Snehangshu" }]
keywords = ["gmail", "cli", "email", "terminal", "oauth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "keyring>=24.0.0",
    "platformdirs>=3.0.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
# PNG attachments display without this. Pillow is only needed to decode the
# other formats, and to build the half-block preview for terminals with no
# image protocol of their own.
images = ["pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pillow>=10.0"]

[project.scripts]
gmail = "gmcli.cli:main"

[project.urls]
Homepage = "https://github.com/snehangshu2002/gmcli"
Issues = "https://github.com/snehangshu2002/gmcli/issues"

[tool.hatch.version]
path = "src/gmcli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gmcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
